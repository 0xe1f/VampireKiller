{% assign src = '/manual/assets/images/' | append: include.kind | append: '/' | append: include.slug | append: '.png' %}
{% if include.href %}
<a class="portrait" href="{{ include.href | relative_url }}">
  <img src="{{ src | relative_url }}" alt="{{ include.name }}">
  <span>{{ include.name }}</span>
</a>
{% else %}
<figure class="portrait portrait-plain">
  <img src="{{ src | relative_url }}" alt="{{ include.name }}">
</figure>
{% endif %}
